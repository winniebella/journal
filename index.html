*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"LXGW WenKai","霞鹜文楷","Kaiti SC",serif;
  background:
    /* 右上方的暖光，极宽，读成"光"不是"圆" */
    radial-gradient(132% 90% at 86% -14%, rgba(255,247,229,.92), rgba(255,242,223,0) 58%),
    /* 左下角的暖影，把重心压住 */
    radial-gradient(142% 104% at 2% 118%, rgba(206,74,118,.38), rgba(206,74,118,0) 62%),
    /* 斜向一道浅粉，做出"层" */
    linear-gradient(103deg, rgba(255,238,244,0) 10%, rgba(255,238,244,.68) 30%, rgba(255,238,244,0) 52%),
    /* 斜向一道深一点的粉 */
    linear-gradient(103deg, rgba(255,174,203,0) 44%, rgba(255,174,203,.42) 62%, rgba(255,174,203,0) 82%),
    /* 上方偏亮的一团，让上半有呼吸 */
    radial-gradient(98% 64% at 26% 12%, rgba(255,229,239,.54), rgba(255,229,239,0) 78%),
    /* 另一道不同角度的斜层，交叉起来才像"层"不像"渐变" */
    linear-gradient(74deg, rgba(255,212,226,0) 32%, rgba(255,212,226,.32) 52%, rgba(255,212,226,0) 72%),
    /* 底边压一点暖玫瑰，给画面一个"落点" */
    linear-gradient(0deg, rgba(222,118,155,.30) 0%, rgba(222,118,155,0) 24%),
    /* 主体：从上到下不同明度的粉 */
    linear-gradient(173deg,
      #fffdfc 0%, #fff8f9 10%, #ffeff3 22%, #ffe1ea 36%,
      #ffd2df 50%, #fcc0d3 64%, #f3aac3 78%, #e594b0 90%, #d585a1 100%);
  display:grid; place-items:center;
}

/* ---------- 情窦初开：一层薄光 + 小泡 ---------- */
.sun{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(44% 36% at 84% 2%, rgba(255,247,220,.72), rgba(255,240,208,0) 64%)}
.haze{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:
    radial-gradient(150% 96% at 50% 48%, rgba(255,226,236,.14), rgba(255,204,224,.09) 62%, rgba(255,192,216,.14) 100%)}
.atmo{position:fixed;inset:0;pointer-events:none;z-index:2;
  background-image:var(--grain);background-size:180px 180px;opacity:.55}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.bub{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.96) 0%, rgba(255,255,255,.30) 38%, rgba(255,240,246,.05) 66%, rgba(255,255,255,0) 78%);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:0 0 12px rgba(255,255,255,.45), inset 0 0 8px rgba(255,255,255,.55);
  animation:rise linear infinite}
@keyframes rise{
  0%{transform:translate3d(0,0,0) scale(.55);opacity:0}
  10%{opacity:.62}
  80%{opacity:.46}
  100%{transform:translate3d(26px,-118vh,0) scale(1.08);opacity:0}
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:8;
  background:radial-gradient(ellipse at 50% 44%, rgba(0,0,0,0) 38%, rgba(158,66,101,.18) 70%, rgba(118,40,72,.36) 100%)}

.scene{position:relative;z-index:4;display:grid;place-items:center;width:100%;height:100%}
.float{will-change:transform}
.book{
  position:relative;
  width:calc(var(--pw)*2); height:var(--ph);
  transform:translateX(calc(var(--pw)/-2));
  transition:transform 1.15s cubic-bezier(.33,.06,.24,1);
  touch-action:none;
}
.book.opened{transform:translateX(0)}
.cast{position:fixed;left:50%;top:calc(50% + var(--ph)/2 + 26px);
  width:calc(var(--pw)*1.7);height:76px;margin-left:calc(var(--pw)*-0.85);
  pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at 50% 50%, rgba(150,78,105,.42), rgba(150,78,105,.06) 48%, rgba(150,78,105,0) 74%);
  filter:blur(14px)}

/* ---------------- 纸页：N 段相铰，拼出弧线 ---------------- */
.sheet{
  position:absolute; left:var(--pw); top:0;
  width:var(--pw); height:100%;
  transform-style:preserve-3d;
}
.seg{
  position:absolute; left:0; top:0; width:100%; height:100%;
  transform-origin:left center;
  transform-style:preserve-3d;
}
.sheet > .seg{width:calc(100% / var(--segN))}
.seg .seg{left:calc(100% - 0.3px)}
.sheet.turned > .seg{transform:rotateY(-180deg)}
.sheet.turned .seg .seg{transform:none}

.face{
  position:absolute; inset:0; overflow:hidden;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background-color:var(--paper);
  background-image:var(--grain), linear-gradient(rgba(158,118,98,.14) 1px, transparent 1px);
  background-size:180px 180px, 100% 34px;
  background-position:calc(var(--k, 0) * var(--pw) / var(--segN) * -1) 0, 0 24px;
}
.face.back{transform:rotateY(180deg)}
.sheet > .seg > .face::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30px;
  pointer-events:none;
  background:linear-gradient(90deg, rgba(120,86,74,.20), rgba(120,86,74,0))}
.sheet > .seg > .face.back::after{left:auto;right:0;
  background:linear-gradient(270deg, rgba(120,86,74,.20), rgba(120,86,74,0))}

/* 弧面上的明暗：每段单独给透明度，沿弧线渐变，不出条纹 */
.shade{position:absolute;inset:0;pointer-events:none;opacity:0;background:#3d2f28}

.pnum{position:absolute;bottom:16px;left:0;right:0;text-align:center;
  font-size:11px;color:rgba(150,118,118,.55);letter-spacing:.2em}

.veil{position:absolute;top:0;bottom:0;width:var(--pw);pointer-events:none;opacity:0;
  background:linear-gradient(90deg, rgba(120,60,60,.34), rgba(120,60,60,.04) 54%, rgba(120,60,60,.20))}
.veil.r{left:var(--pw)}
.veil.l{left:0;transform:scaleX(-1)}

/* ---------------- 书封 ---------------- */
.cover{
  position:absolute; left:var(--pw); top:-5px;
  width:calc(var(--pw) + 7px); height:calc(100% + 10px);
  transform-origin:left center;
  transform-style:preserve-3d;
  transform:perspective(1600px) rotateY(0deg);
  transition:transform 1.15s cubic-bezier(.33,.06,.24,1);
  cursor:pointer;
}
.cover.opened{transform:perspective(1600px) rotateY(-180deg)}
.cover.dragging{transition:none}
.cover-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:2px 9px 9px 2px;
  background-color:var(--cover);
  background-image:
    radial-gradient(120% 92% at 30% 10%, rgba(255,240,246,.28), rgba(255,240,246,0) 62%),
    linear-gradient(160deg, rgba(255,255,255,.10), rgba(0,0,0,.06)),
    var(--grain);
  background-size:100% 100%, 100% 100%, 180px 180px;
  box-shadow:0 22px 54px rgba(140,64,90,.34),
             3px 0 0 0 #cf849c, 5px 0 0 0 #b76b85, 6px 2px 12px rgba(140,64,90,.24);
}
.cover-face::before{content:"";position:absolute;inset:15px;border:1px solid rgba(255,246,250,.62)}
.cover-face::after{content:"";position:absolute;inset:21px;border:1px solid rgba(255,246,250,.24)}
.cover-back{
  position:absolute;inset:0;transform:rotateY(180deg);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background-color:#fff6ec;background-image:var(--grain);background-size:180px 180px;
  box-shadow:inset -34px 0 52px -26px rgba(150,105,100,.16),
             inset 0 -44px 62px -34px rgba(160,125,105,.12);
}
.cover-back::after{content:"";position:absolute;top:0;bottom:0;right:0;width:36px;
  background:linear-gradient(270deg, rgba(120,86,74,.14), rgba(120,86,74,0))}

            <path d="M34 29 C 31 22 25 19 20 21"/>

            <ellipse cx="17.5" cy="43" rx="6" ry="3.2" transform="rotate(-12 17.5 43)"/>
            <ellipse cx="82.5" cy="43" rx="6" ry="3.2" transform="rotate(12 82.5 43)"/>
            <path d="M50 27 C 62 27 70 33 70 43 L 70 55 C 70 63 61 69 50 69 C 39 69 30 63 30 55 L 30 43 C 30 33 38 27 50 27 Z"/>

<script>
var N = 10, S = 9, cur = 0, opened = false;
var book=document.getElementById('book'), cover=document.getElementById('cover');
var blockR=document.getElementById('blockR'), blockL=document.getElementById('blockL');
var veilR=document.getElementById('veilR'), veilL=document.getElementById('veilL');
var cast=document.getElementById('cast'), hint=document.getElementById('hint');
var floatEl=document.getElementById('float'), closeBtn=document.getElementById('closeBtn');

/* ---- 建页：N 段嵌套，页码挂在正中那段 ---- */
/* 页码内容全部由循环计数生成，无任何外部输入，innerHTML 在此安全 */
var sheets = [];
var MID = (S - 1) / 2 | 0;
function makeSheet(i){
  var sheet = document.createElement('div');
  sheet.className = 'sheet';
  var parent = sheet;
  for (var k = 0; k < S; k++) {
    var seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.setProperty('--k', k);
    parent.appendChild(seg);

    var f = document.createElement('div');
    f.className = 'face front';
    f.appendChild(document.createElement('div')).className = 'shade';
    var plf = document.createElement('div'); plf.className='pl'; plf.dataset.pg=(2*i+1); f.appendChild(plf);
    if (k === MID) {
      var p1 = document.createElement('div');
      p1.className = 'pnum'; p1.textContent = '— ' + (2*i+1) + ' —';
      p1.dataset.pg = (2*i+1);
      p1.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      p1.addEventListener('click', function(e){ e.stopPropagation();
        if (window.__openPage) window.__openPage(2*i+1); });
      f.appendChild(p1);
    }
    var b = document.createElement('div');
    b.className = 'face back';
    b.appendChild(document.createElement('div')).className = 'shade';
    var plb = document.createElement('div'); plb.className='pl'; plb.dataset.pg=(2*i+2); b.appendChild(plb);
    if (k === MID) {
      var p2 = document.createElement('div');
      p2.className = 'pnum'; p2.textContent = '— ' + (2*i+2) + ' —';
      p2.dataset.pg = (2*i+2);
      p2.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      p2.addEventListener('click', function(e){ e.stopPropagation();
        if (window.__openPage) window.__openPage(2*i+2); });
      b.appendChild(p2);
    }
    seg.appendChild(f); seg.appendChild(b);
    parent = seg;
  }
  book.insertBefore(sheet, cover);
  sheets.push(sheet);
}
for (var _s = 0; _s < N; _s++) makeSheet(_s);

/* ---- 层序 ---- */
function paintZ(){
  for (var i=0;i<N;i++){
    if (sheets[i].dataset.anim === '1') continue;
    sheets[i].style.zIndex = (i < cur) ? (600 + 2*i) : (400 - 2*i);
  }
  cover.style.zIndex = opened ? 150 : 900;
  blockR.style.opacity = opened ? 1 : 0;
  blockL.style.opacity = (opened && cur > 0) ? 1 : 0;
  closeBtn.classList.toggle('on', opened);
  var _nb=document.getElementById('newBtn'); if(_nb) _nb.classList.toggle('on', opened);
}
function sync(){
  while (N < cur + 4){ makeSheet(N); N++; }
  for (var i=0;i<N;i++) sheets[i].classList.toggle('turned', i < cur);
  book.classList.toggle('opened', opened);
  cover.classList.toggle('opened', opened);
  paintZ();
}
sync();

// 调试直链：#open / #p2 / #half
if (location.hash === '#open') { opened = true; sync(); }
if (/^#p\d+$/.test(location.hash)) {
  opened = true; cur = Math.min(N, parseInt(location.hash.slice(2), 10) || 0); sync();
}
if (/^#a\d+$/.test(location.hash)) {
  opened = true; sync();
  var _a = Math.min(180, parseInt(location.hash.slice(2), 10) || 45);
  var _t = sheets[0]; _t.dataset.anim = '1'; _t.style.zIndex = 800;
  setCurl(_t, -_a, _a / 180);
  veilR.style.zIndex = 700; veilR.style.opacity = (Math.sin(_a/180*Math.PI)*0.42).toFixed(3);
}
if (location.hash === '#half') {
  opened = true; sync();
  var _s = sheets[0]; _s.dataset.anim = '1'; _s.style.zIndex = 800;
  setCurl(_s, -92, 0.51);
  veilR.style.zIndex = 700; veilR.style.opacity = 0.42;

/* ---- 弧线：N 段等角度递增，拼出圆弧（不是折线） ---- */
function segsOf(sh){ return sh.querySelectorAll('.seg'); }
function clearSegs(sh){
  var a = segsOf(sh);
  for (var i=0;i<a.length;i++){ a[i].style.transform=''; }
  var sd = sh.querySelectorAll('.shade');
  for (var i=0;i<sd.length;i++) sd[i].style.opacity = 0;
}
function setCurl(sh, theta, p){
  p = Math.max(0, Math.min(1, p));
  var B = Math.sin(p * Math.PI) * 44;        // 总弯曲角
  var step = B / (S - 1);                    // 每段等角度 -> 圆弧
  var a0 = theta + B / 2;                    // 书脊侧
  var segs = segsOf(sh);
  var prev = 0;
  for (var k = 0; k < S; k++) {
    var abs = a0 - step * k;
    segs[k].style.transform = 'rotateY(' + (abs - prev).toFixed(3) + 'deg)';
    prev = abs;
  }
  // 沿弧线渐暗，段段衔接，不出条纹
  var base = Math.sin(p * Math.PI);
  var sh8 = sh.querySelectorAll('.shade');
  var per = sh8.length / S;
  for (var k = 0; k < S; k++) {
    var o = (base * (0.26 - 0.21 * (k / (S - 1)))).toFixed(3);
    for (var j = 0; j < per; j++) sh8[k * per + j].style.opacity = o;
  }
}
function easeInOutCubic(t){
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
}
function animateSheet(sh, from, to, dur, done){
  sh.dataset.anim = '1';
  sh.style.zIndex = 800;
  var t0 = performance.now();
  function frame(now){
    var t = Math.min(1, (now - t0) / dur);
    var e = easeInOutCubic(t);
    var th = from + (to - from) * e;
    setCurl(sh, th, Math.min(1, Math.abs(th) / 180));
    if (t < 1) requestAnimationFrame(frame);
    else {
      sh.dataset.anim = '';
      sh.style.zIndex = '';
      clearSegs(sh);
      if (done) done();
      paintZ();
    }
  }
  requestAnimationFrame(frame);
}

/* ---- 拖动 ---- */
var drag = null;
function spineX(){ var r = book.getBoundingClientRect(); return r.left + r.width/2; }
function halfW(){ return book.getBoundingClientRect().width / 2; }

book.addEventListener('pointerdown', function(e){
  if (!opened) return;
  var fwd = e.clientX > spineX();
  if (!fwd && cur === 0){
    drag = { kind:'cover', startX:e.clientX, pw:halfW(), prog:0 };
    cover.classList.add('dragging');
  } else {
    var idx = fwd ? cur : cur - 1;
    if (idx < 0 || idx >= N) return;
    drag = { kind:'sheet', fwd:fwd, idx:idx, startX:e.clientX, pw:halfW(), prog:0 };
  }
  try { book.setPointerCapture(e.pointerId); } catch(err){}
  hint.classList.add('gone');
}, {passive:true});

book.addEventListener('pointermove', function(e){
  if (!drag) return;
  var dx = drag.startX - e.clientX;
  var prog = (drag.kind === 'cover' || drag.fwd) ? dx / drag.pw : -dx / drag.pw;
  prog = Math.max(0, Math.min(1, prog));
  drag.prog = prog;

  if (drag.kind === 'cover'){
    cover.style.transform = 'perspective(1600px) rotateY(' + (-180 + prog*180).toFixed(2) + 'deg)';
    return;
  }
  var sh = sheets[drag.idx];
  sh.dataset.anim = '1'; sh.style.zIndex = 800;
  var th = drag.fwd ? (-prog * 180) : (-180 + prog * 180);
  setCurl(sh, th, prog);
  var v = drag.fwd ? veilR : veilL;
  var o = drag.fwd ? veilL : veilR;
  v.style.zIndex = 700;
  v.style.opacity = (Math.sin(prog * Math.PI) * 0.44).toFixed(3);
  o.style.opacity = 0;
}, {passive:true});

function endDrag(){
  if (!drag) return;
  var d = drag; drag = null;
  veilR.style.opacity = 0; veilL.style.opacity = 0;
  var tap = d.prog < 0.07;

  if (d.kind === 'cover'){
    cover.classList.remove('dragging');
    cover.style.transform = '';
    if (tap || d.prog > 0.30) doClose();
    else paintZ();
    return;
  }

  var sh = sheets[d.idx];

  /* 点左半页：不管翻到第几页，直接合上 */
  if (tap && !d.fwd){ doClose(); return; }
  if (tap){
    clearSegs(sh);
    sh.dataset.anim = ''; sh.style.zIndex = '';
    paintZ();
    return;
  }

  var from = d.fwd ? (-d.prog*180) : (-180 + d.prog*180);
  var go = d.prog > 0.30;
  if (go) { if (d.fwd) cur = d.idx + 1; else cur = d.idx; }
  var to = go ? (d.fwd ? -180 : 0) : (d.fwd ? 0 : -180);
  var dur = go ? Math.max(360, 900*(1-d.prog)) : Math.max(300, 700*d.prog);

  if (go) play(aTurn);
  animateSheet(sh, from, to, dur, function(){
    sh.classList.toggle('turned', go ? d.fwd : !d.fwd);
    sync();
  });
  paintZ();
}
book.addEventListener('pointerup', endDrag);
book.addEventListener('pointercancel', endDrag);

/* ---- 开 / 合 ---- */
function doClose(){
  play(aCover);
  var turned = [];
  for (var i = cur - 1; i >= 0; i--) turned.push(i);
  turned.forEach(function(idx, k){
    setTimeout(function(){
      sheets[idx].classList.remove('turned');
      animateSheet(sheets[idx], -180, 0, 340, null);
    }, k * 54);
  });
  var wait = turned.length * 54 + 380;
  setTimeout(function(){
    cur = 0; opened = false;
    for (var i=0;i<N;i++){ clearSegs(sheets[i]); }
    cover.classList.remove('opened');
    book.classList.remove('opened');
    sync();
    hint.textContent = '点 一 下 书 封';
    hint.classList.remove('gone');
    setTimeout(function(){ hint.classList.add('gone'); }, 2600);
  }, wait);
}

cover.addEventListener('click', function(){
  if (opened) return;
  opened = true;
  play(aCover);
  sync();
  hint.textContent = '左 右 滑 动 翻 页 · 点 页 码 改 这 一 页 · 点 左 页 合 上';
  hint.classList.remove('gone');
  setTimeout(function(){ hint.classList.add('gone'); }, 4800);
});

closeBtn.addEventListener('click', function(){
  if (opened) doClose();
});

/* ---- 缓慢呼吸漂浮 ---- */
var TAU = Math.PI * 2;
function tick(now){
  var t = now / 1000;
  var y  = 10  * Math.sin(t * TAU / 12.5)
         + 6   * Math.sin(t * TAU / 7.9  + 1.2)
         + 3.5 * Math.sin(t * TAU / 21.3 + 2.4);
  var rz = 0.55 * Math.sin(t * TAU / 17.1 + 0.6) + 0.18 * Math.sin(t * TAU / 9.7);
  var rx = 18 + 1.8 * Math.sin(t * TAU / 14.3 + 2.0);
  floatEl.style.transform =
    'perspective(2600px) translateY(' + y.toFixed(2) + 'px)' +
    ' rotateX(' + rx.toFixed(3) + 'deg) rotateY(-5deg) rotateZ(' + rz.toFixed(3) + 'deg)';
  var k = 1 - y / 28;
  cast.style.transform = 'scaleX(' + k.toFixed(3) + ') scaleY(' + (0.86 + (k-1)*0.5).toFixed(3) + ')';
  cast.style.opacity = (0.50 + y / 80).toFixed(3);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

  if (p.length >= 3){
    box.appendChild(tx('b', null, p[1] + ' \u00b7 ' + p[2]));
    box.appendChild(tx('i', null, p[0]));
  } else {
    box.appendChild(tx('b', null, String(s)));
  }
  return box;
}

function today(){
  var d = new Date(), m = d.getMonth()+1, dd = d.getDate();
  return d.getFullYear() + '.' + (m<10?'0':'')+m + '.' + (dd<10?'0':'')+dd;
}

/* ---------- 画一页 ---------- */
function buildPC(pg, d){
  var pc = el('div','pc');
  var hasPhoto = !!(d.photos && d.photos.length);

  if (hasPhoto){
    var hd = el('div','hd');
    var shot = el('div','shot');
    var frame = el('div','frame');
    var ph = el('div','ph');
    var track = el('div','track');
    for (var i=0;i<d.photos.length;i++){
      var im = new Image(); im.src = d.photos[i]; im.alt = ''; track.appendChild(im);
    }
    ph.appendChild(track);

    if (d.photos.length > 1){
      var pv = tx('b','pv','\u2039'), nx = tx('b','nx','\u203a');
      pv.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      nx.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
      pv.addEventListener('click', function(e){ e.stopPropagation(); step(pg,-1); });
      nx.addEventListener('click', function(e){ e.stopPropagation(); step(pg, 1); });
      ph.appendChild(pv); ph.appendChild(nx);

      var cnt = el('div','pcount'); cnt.textContent = '1 / ' + d.photos.length;
      ph.appendChild(cnt);

      var dots = el('div','dots');
      for (var j=0;j<d.photos.length;j++) dots.appendChild(el('i', j===0 ? 'on' : ''));
      ph.appendChild(dots);
    }

    frame.appendChild(ph); shot.appendChild(frame); hd.appendChild(shot);

    var side = el('div','side');
    side.appendChild(tx('span','q a','\u201c'));
    if (d.date) side.appendChild(dateTag(d.date));
    side.appendChild(tx('span','q b','\u201d'));
    hd.appendChild(side);
    pc.appendChild(hd);
  } else {
    var row = el('div','drow');
    row.appendChild(tx('span','q in','\u201c'));
    if (d.date) row.appendChild(dateTag(d.date));
    row.appendChild(tx('span','q in','\u201d'));
    pc.appendChild(row);
  }

  if (d.text){ var jt = el('div','jt'); jt.textContent = d.text; pc.appendChild(jt); }
  return pc;
}

/* 字多就自动收小，永远不切字 */
function fitText(pg){
  var all = document.querySelectorAll('.pl[data-pg="' + pg + '"] .jt');
  if (!all.length) return;
  var probe = all[0];
  var sizes = [14.6, 13.9, 13.2, 12.5, 11.8, 11.1, 10.4, 9.7, 9.0];
  var pick = sizes[sizes.length - 1];
  probe.style.fontSize = '';
  for (var i=0;i<sizes.length;i++){
    probe.style.fontSize = sizes[i] + 'px';
    if (probe.scrollHeight <= probe.clientHeight + 1){ pick = sizes[i]; break; }
  }
  for (var k=0;k<all.length;k++) all[k].style.fontSize = pick + 'px';
}

function renderPage(pg){
  var d = data[pg];
  var nodes = document.querySelectorAll('.pl[data-pg="' + pg + '"]');
  var pap = (d && d.paper != null) ? PAPERS[d.paper] : PAPERS[0];
  for (var i=0;i<nodes.length;i++){
    var pl = nodes[i];
    pl.style.backgroundImage = pap.img ? 'url("' + pap.img + '")' : 'none';
    pl.style.setProperty('--pt', pap.pad[0] + '%');
    pl.style.setProperty('--pr', pap.pad[1] + '%');
    pl.style.setProperty('--pb', pap.pad[2] + '%');
    pl.style.setProperty('--pl', pap.pad[3] + '%');
    pl.style.setProperty('--sw', pap.sw + '%');
    while (pl.firstChild) pl.removeChild(pl.firstChild);
    if (d) pl.appendChild(buildPC(pg, d));
  }
  bindSwipe(pg);
  if (d && d.photos && d.photos.length > 1) setSlide(pg, slide[pg] || 0);
  fitText(pg);
}

/* ---------- 相册：滑动 / 箭头 ---------- */
function step(pg, dir){
  var d = data[pg]; if (!d || !d.photos) return;
  setSlide(pg, (slide[pg] || 0) + dir);
}

function setSlide(pg, n){
  var d = data[pg];
  if (!d || !d.photos || !d.photos.length) return;
  n = Math.max(0, Math.min(d.photos.length - 1, n));
  slide[pg] = n;
  var pls = document.querySelectorAll('.pl[data-pg="' + pg + '"]');
  for (var i=0;i<pls.length;i++){
    var ph = pls[i].querySelector('.ph'); if (!ph) continue;
    var tr = ph.querySelector('.track');
    if (tr){ tr.style.transform = 'translateX(' + (-n * ph.clientWidth) + 'px)'; }
    var ds = ph.querySelectorAll('.dots i');
    for (var j=0;j<ds.length;j++) ds[j].className = (j === n ? 'on' : '');
    var c = ph.querySelector('.pcount');
    if (c) c.textContent = (n+1) + ' / ' + d.photos.length;
  }
}

function bindSwipe(pg){
  var shots = document.querySelectorAll('.pl[data-pg="' + pg + '"] .shot');
  for (var i=0;i<shots.length;i++){
    (function(elm){
      var sx = 0, sy = 0, down = false, moved = false;
      elm.addEventListener('pointerdown', function(e){
        e.stopPropagation();
        var d = data[pg];
        if (!d || !d.photos || d.photos.length < 2) return;
        down = true; moved = false; sx = e.clientX; sy = e.clientY;
        try{ elm.setPointerCapture(e.pointerId); }catch(err){}
      });
      elm.addEventListener('pointermove', function(e){
        if (!down) return;
        e.stopPropagation();
        var dx = e.clientX - sx;
        if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(e.clientY - sy)) moved = true;
      });
      elm.addEventListener('pointerup', function(e){
        if (!down) return;
        down = false; e.stopPropagation();
        var dx = e.clientX - sx;
        if (!moved) return;
        if (dx < -22) step(pg, 1);
        else if (dx > 22) step(pg, -1);
      });
      elm.addEventListener('pointercancel', function(){ down = false; });
    })(shots[i]);
  }
}

/* ---------- 面板 ---------- */
var ed = document.getElementById('ed'),
    edPg = document.getElementById('edPg'),
    papersBox = document.getElementById('papers'),
    shotsBox = document.getElementById('shots'),
    fileIn = document.getElementById('fileIn'),
    dateIn = document.getElementById('dateIn'),
    txtIn = document.getElementById('txtIn'),
    btnNext = document.getElementById('edNext'),
    btnBack = document.getElementById('edBack'),
    btnDel = document.getElementById('edDel'),
    edX = document.getElementById('edX'),
    tabs = document.querySelectorAll('.ed-tabs b');

var ST = { step:1, pg:1 };
var draft = { paper:0, photos:[], date:'', text:'' };

/* 纸样缩略图 */
for (var pi=0; pi<PAPERS.length; pi++){
  (function(i){
    var b = el('div','paper' + (i===0 ? ' p0' : ''));
    if (PAPERS[i].img) b.style.backgroundImage = 'url("' + PAPERS[i].img + '")';
    b.appendChild(tx('span', null, PAPERS[i].name));
    b.addEventListener('click', function(){
      draft.paper = i;
      var all = papersBox.children;
      for (var k=0;k<all.length;k++) all[k].className = 'paper' + (k===0?' p0':'') + (k===i?' on':'');
    });
    papersBox.appendChild(b);
  })(pi);
}

function paintPapers(){
  var all = papersBox.children;
  for (var k=0;k<all.length;k++)
    all[k].className = 'paper' + (k===0?' p0':'') + (k===draft.paper?' on':'');
}

function paintShots(){
  while (shotsBox.firstChild) shotsBox.removeChild(shotsBox.firstChild);
  for (var i=0;i<draft.photos.length;i++){
    (function(i){
      var it = el('div','it');
      var im = new Image(); im.src = draft.photos[i]; it.appendChild(im);
      var x = tx('b', null, '\u00d7');
      x.addEventListener('click', function(){
        draft.photos.splice(i,1); paintShots();
      });
      it.appendChild(x);
      shotsBox.appendChild(it);
    })(i);
  }
}

function showStep(n){
  ST.step = n;
  var steps = ed.querySelectorAll('.ed-step');
  for (var i=0;i<steps.length;i++)
    steps[i].hidden = (parseInt(steps[i].dataset.step,10) !== n);
  btnBack.disabled = (n === 1);
  btnNext.textContent = (n === 3) ? '写 好 了' : '下一步';
}

function paintTabs(){
  var lpg = 2*cur, rpg = 2*cur + 1;
  tabs[0].className = (ST.pg === rpg) ? 'on' : '';
  tabs[1].className = (ST.pg === lpg) ? 'on' : '';
  var dis = (cur === 0 || lpg < 1);
  tabs[1].style.opacity = dis ? .38 : 1;
  tabs[1].style.pointerEvents = dis ? 'none' : 'auto';
}

function openEdPage(pg){
  if (!opened) return;
  if (!pg || pg < 1) return;
  ST.pg = pg;
  paintTabs();
  var d = data[pg] || {};
  draft = {
    paper: (d.paper != null ? d.paper : 0),
    photos: (d.photos ? d.photos.slice() : []),
    date: d.date || today(),
    text: d.text || ''
  };
  edPg.textContent = '第 ' + pg + ' 页';
  paintPapers(); paintShots();
  dateIn.value = draft.date; txtIn.value = draft.text;
  showStep(1);
  ed.classList.add('on');
}
window.__openPage = openEdPage;

function closeEd(){ ed.classList.remove('on'); }

function commit(){
  var d = data[ST.pg] || {};
  d.paper = draft.paper;
  d.photos = draft.photos.slice();
  d.date = dateIn.value.trim() || draft.date;
  d.text = txtIn.value.replace(/\s+$/,'');
  data[ST.pg] = d;
  slide[ST.pg] = 0;
  save(); renderPage(ST.pg); closeEd();
}

btnNext.addEventListener('click', function(){
  if (ST.step < 3) showStep(ST.step + 1);
  else commit();
});
btnBack.addEventListener('click', function(){ if (ST.step > 1) showStep(ST.step - 1); });
edX.addEventListener('click', closeEd);
ed.addEventListener('click', function(e){ if (e.target === ed) closeEd(); });
btnDel.addEventListener('click', function(){
  delete data[ST.pg]; slide[ST.pg] = 0; save(); renderPage(ST.pg); closeEd();
});

for (var ti=0; ti<tabs.length; ti++){
  (function(t){
    t.addEventListener('click', function(){
      var want = (t.dataset.side === 'l') ? (2*cur) : (2*cur + 1);
      if (want < 1) want = 2*cur + 1;
      openEdPage(want);
    });
  })(tabs[ti]);
}

/* 选图 -> 压到 1100px 再存，免得 localStorage 爆 */
function shrink(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var mw = 1100, sc = Math.min(1, mw / img.width);
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * sc);
      c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function(){ cb(null); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

fileIn.addEventListener('change', function(){
  var fs = fileIn.files; if (!fs || !fs.length) return;
  var list = Array.prototype.slice.call(fs), left = list.length;
  list.forEach(function(f){
    shrink(f, function(url){
      if (url) draft.photos.push(url);
      if (--left === 0){ paintShots(); fileIn.value = ''; }
    });
  });
});

document.getElementById('newBtn').addEventListener('click', function(){ openEdPage(2*cur + 1); });

/* ---------- 备份 / 恢复 ---------- */
var bakIn = document.getElementById('bakIn');
document.getElementById('edBak').addEventListener('click', function(){
  var blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '\u89e6\u52a8\u7684\u4f9d\u604b-\u5907\u4efd.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
});
document.getElementById('edRes').addEventListener('click', function(){ bakIn.click(); });
bakIn.addEventListener('change', function(){
  var f = bakIn.files && bakIn.files[0]; if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var o = JSON.parse(fr.result);
      for (var k in o){ if (Object.prototype.hasOwnProperty.call(o, k)) data[k] = o[k]; }
      ensurePages(); save();
      for (var k2 in data){ if (Object.prototype.hasOwnProperty.call(data, k2)) renderPage(parseInt(k2,10)); }
    }catch(e){}
    bakIn.value = '';
  };
  fr.readAsText(f);
});

/* ---------- 启动 ---------- */
load();

function ensurePages(){
  var maxP = 0;
  for (var k in data){ if (Object.prototype.hasOwnProperty.call(data, k)){ var n = parseInt(k,10); if (n > maxP) maxP = n; } }
  while (maxP > 2*N){ makeSheet(N); N++; }
  paintZ();
}
ensurePages();

for (var pg in data){ if (Object.prototype.hasOwnProperty.call(data, pg)) renderPage(parseInt(pg,10)); }
})();

</script>
